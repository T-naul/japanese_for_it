services:
  front:
    build:
      context: ./jfi-front
    ports:
      - "3000:3000"
    volumes:
      - ./jfi-front:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  back:
    build:
      context: ./jfi-back
    ports:
      - "7000:7000"
    volumes:
      - ./jfi-back:/app
    env_file:
      - ./jfi-back/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./jfi-back
    command: celery -A config worker -l info
    volumes:
      - ./jfi-back:/app
    env_file:
      - ./jfi-back/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
